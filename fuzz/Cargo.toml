[package]
name = "hyperion-vault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

hyperion-vault-core = { path = "../crates/hyperion-vault-core" }
hyperion-vault-api = { path = "../crates/hyperion-vault-api", optional = true }
# Pinned identically to the workspace so their types unify with the API crate's.
openraft = { version = "=0.9.25", features = ["serde", "storage-v2", "loosen-follower-log-revert"], optional = true }
redb = { version = "=4.1.0", optional = true }
axum = { version = "=0.8.9", optional = true }
tokio = { version = "=1.54.1", features = ["rt"], optional = true }

[features]
# The API targets pull in the full server dependency tree (redb, openraft,
# aws-sdk-kms, ...). They are opt-in so the lightweight core targets build fast.
#   cargo +nightly fuzz run --features api store_decode
api = [
    "dep:hyperion-vault-api",
    "dep:openraft",
    "dep:redb",
    "dep:axum",
    "dep:tokio",
]

# Detach from the parent workspace so `cargo build/test --workspace` and the
# stable-pinned CI never try to compile this nightly-only crate.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "ip_allowlist_parse"
path = "fuzz_targets/ip_allowlist_parse.rs"
test = false
doc = false
bench = false


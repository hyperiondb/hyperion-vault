name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  fuzz-smoke:
    name: fuzz build + 30s per target
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: build every target
        run: cargo +nightly fuzz build --features api
      # run-all.sh treats the targets listed in its KNOWN_FAILING map as
      # expected failures (each names the VULN.md finding it reproduces) and
      # fails the job on any other non-zero exit.
      # Invoked through bash because run-all.sh is stored without the
      # executable bit (and the repo is developed on Windows, where git's
      # core.fileMode is off, so that bit cannot be set from there).
      - name: short sweep
        run: bash fuzz/run-all.sh 30
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
